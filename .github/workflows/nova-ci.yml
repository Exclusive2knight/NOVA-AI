name: NOVA code and artifacts checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NOVA frontend and backend
        run: node tests/nova_smoke.cjs
      - name: Train and test NOVA Native entirely offline
        run: node tests/nova_native.cjs
      - name: Validate NOVA Studio UI, slang and artifacts
        run: node tests/nova_studio.cjs
      - name: Validate pretrained NOVA Native weights and held-out accuracy
        run: node tests/nova_native_checkpoint.cjs
      - name: Validate original model and memory Python code
        run: python3 -m py_compile training/train_nova.py training/infer_nova.py training/memory_index.py
      - name: Verify NOVA training pipeline syntax
        run: python3 -m py_compile training/prepare_corpus.py training/synthetic_dialogue.py training/prepare_preferences.py training/constitutional_review.py training/pretrain.py training/train_preferences.py training/test_pipeline.py
      - name: Test licensing, data splits, synthetic conversations, consent and alignment review
        run: python3 training/test_pipeline.py
      - name: Test local memory indexing
        run: |
          python3 training/memory_index.py ingest training/examples.jsonl --db /tmp/nova-memory-test.db
          python3 training/memory_index.py query "neural network" --db /tmp/nova-memory-test.db
          python3 training/memory_index.py stats --db /tmp/nova-memory-test.db
