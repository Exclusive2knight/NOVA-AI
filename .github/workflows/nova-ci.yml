name: NOVA code and artifacts checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate NOVA frontend and backend
        run: node tests/nova_smoke.cjs
      - name: Train and test NOVA Native entirely offline
        run: node tests/nova_native.cjs
      - name: Test NOVA Native Online integration and source-only fallback
        run: node tests/nova_online.cjs
      - name: Test expanded NOVA Native skills and local request policy
        run: node tests/nova_skills.cjs
      - name: Validate NOVA Studio UI, slang and artifacts
        run: node tests/nova_studio.cjs
      - name: Validate pretrained NOVA Native weights and held-out accuracy
        run: node tests/nova_native_checkpoint.cjs
      - name: Validate original model and memory Python code
        run: python3 -m py_compile training/train_nova.py training/infer_nova.py training/memory_index.py
      - name: Check NOVA open-weight model training recipe syntax
        run: python3 -m py_compile training/build_nova_sft.py training/finetune_open_model.py training/evaluate_nova_open_model.py training/chat_nova_open_model.py training/test_open_sft.py
      - name: Test optional strong Qwen3-8B QLoRA training recipe
        run: python3 -m py_compile training/finetune_qwen3_8b_qlora.py training/test_strong_8b.py && python3 training/test_strong_8b.py
      - name: Test rights-screened conversation tuning examples and held-out splits
        run: python3 training/test_open_sft.py
      - name: Verify NOVA training pipeline syntax
        run: python3 -m py_compile training/prepare_corpus.py training/synthetic_dialogue.py training/prepare_preferences.py training/constitutional_review.py training/pretrain.py training/train_preferences.py training/test_pipeline.py training/train_starter_pack.py
      - name: Test licensing, data splits, synthetic conversations, consent and alignment review
        run: python3 training/test_pipeline.py
      - name: Test incremental large-memory indexing and quota
        run: python3 training/test_memory_index.py
      - name: Evaluate chat routing, web research and memory privacy regressions
        run: node tests/nova_behavior_eval.cjs
      - name: Test offline project linting and repair integration
        run: node tests/nova_project_check.cjs
      - name: Test secure sandbox preview errors and user-approved repair
        run: node tests/nova_preview.cjs
      - name: Test Cloudflare image generation authentication and output
        run: node tests/nova_image.cjs
      - name: Validate NOVA Create Studio image and GLB mobile workflows
        run: node tests/nova_create.cjs
      - name: Test optional AI-planned custom GLB geometry
        run: node tests/nova_3d_plan.cjs
      - name: Test real procedural GLB generation and glTF 2.0 format
        run: node tests/nova_3d.cjs
      - name: Validate Cloudflare Vision photo privacy and security
        run: node tests/nova_vision.cjs
      - name: Validate Cloudflare deployment preparation without credentials
        run: node tests/nova_deploy.cjs
      - name: Test off-device Cloudflare D1 memory authorization and recall
        run: node tests/nova_cloud_memory.cjs
      - name: Test local memory indexing
        run: |
          python3 training/memory_index.py ingest training/examples.jsonl --db /tmp/nova-memory-test.db
          python3 training/memory_index.py query "neural network" --db /tmp/nova-memory-test.db
          python3 training/memory_index.py stats --db /tmp/nova-memory-test.db
